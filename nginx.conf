server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative Location headers: behind Railway the host and scheme nginx sees
    # are not the public ones.
    absolute_redirect off;

    # The dashboard (andrho-tracker-dashboard) behind /dashboard/ and /api/,
    # written by docker-entrypoint.sh when DASHBOARD_URL is set. Same origin
    # as the site, so the session login.html stores is the dashboard's too.
    include /etc/nginx/andrho/*.conf;

    # Articles uploaded from the dashboard have no built page: the template
    # loads them from andrho-api by the slug in the URL.
    location /articulos/ {
        try_files $uri $uri.html $uri/ /articulos/plantilla.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
